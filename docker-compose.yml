version: '3.8'

services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: notification_rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest

  mongodb:
    image: mongo:7.0
    container_name: notification_mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: rootuser
      MONGO_INITDB_ROOT_PASSWORD: rootpassword
    command: ["--replSet", "rs0", "--bind_ip_all"]
    healthcheck:
      test: |
        mongosh -u rootuser -p rootpassword --authenticationDatabase admin --eval "
        try {
          if (rs.status().ok === 1) quit(0);
        } catch (e) {
          if (rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'localhost:27017'}]}).ok === 1) quit(0);
        }
        quit(1);
        "
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  app:
    build: .
    container_name: notification_app
    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_started
    env_file:
      - .env