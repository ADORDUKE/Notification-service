[project]
name = "notification-service"
version = "0.1.0"
description = "Notification Microservice built with Clean Architecture"
readme = "README.md"
requires-python = ">=3.13"

# Main production dependencies
dependencies = [
    "boto3>=1.35.0",
    "email-validator>=2.2.0",
    "pika>=1.3.2",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "pymongo>=4.10.0",
]

# Development dependencies group
[dependency-groups]
dev = [
    "ruff>=0.9.0",
]

# Ruff Linter Configuration
[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["F", "E", "W", "B", "I"]
ignore = []

[tool.ruff.lint.isort]
combine-as-imports = true